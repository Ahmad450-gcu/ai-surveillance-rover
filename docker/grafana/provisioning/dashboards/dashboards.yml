# Dashboards as code: every JSON file in /var/lib/grafana/dashboards (docker/grafana/dashboards, generated by
# docker/grafana/build_dashboards.py) is loaded into the folder "Rover"; edits in the UI are not kept.
apiVersion: 1
providers:
  - name: rover
    folder: Rover
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options: {path: /var/lib/grafana/dashboards}
