# Pipeline settings, tracked by DVC (dvc params diff) and logged to MLflow

dataset:                     # stage "ingest": source dataset -> data lake
  name: rwf2000
  # pinned to a dataset commit, so the same bytes are downloaded every time
  url: https://huggingface.co/datasets/DanJoshua/RWF-2000/resolve/d8bcb9661fa6130b7295fc20712abd9e1b358036/RWF-2000.tar.gz
  sha256: 227c01e017ee3df8753388f81bf0ab65705f5009f3f0e29f7db18bacd81a2d50   # Git LFS oid on the Hub
  size: 12315601005
  bucket: datasets
  key: rwf2000/RWF-2000.tar.gz
  license: research use only (Cheng, Cai & Li, ICPR 2020)

data_validation:             # stage "validate": quality gate between the raw and validated zones
  input: data/raw/pose/rwf2000
  output: data/validated/pose/rwf2000
  min_frames: 20             # a clip must give at least one 2 s window at 10 fps
  box_tolerance: 0.05        # boxes may stick out of the frame by 5% (pose models extrapolate at the edges)
  low_keypoint_conf: 0.3     # warning below this mean keypoint confidence
  max_reject_rate: 0.05      # more than 5% rejected clips stops the pipeline
  min_clips_per_class: 50    # per split and class
  class_balance: [0.3, 0.7]  # allowed share of Fight clips per split

# Training settings (used by training/train_fight.py and tracked by DVC / MLflow)
fight_model:
  data: data/validated/pose/rwf2000   # output of the validate stage (quality-checked clips)
  extra_data: []             # more pose folders, e.g. [data/own/pose] for your labelled rover clips
  window: 20                 # frames per sample at 10 fps = 2 seconds
  stride: 2                  # training windows start every 0.2 s
  proximity: 3.5             # only pairs closer than this many body-widths are judged (same as live)
  consecutive_choices: [2, 3, 4, 5]   # alert rule: this many judgements in a row above the threshold (chosen by CV)
  folds: 5                   # cross-validation folds on the train split (choose threshold + judgements in a row)
  hidden: 64
  layers: 2
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.0001
  batch: 128
  epochs: 40
  patience: 8                # stop when the dev score hasn't improved for this many epochs
  noise: 0.05                # Gaussian noise added to features (augmentation)
  seed: 0
