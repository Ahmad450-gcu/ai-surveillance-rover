name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:                      # backend tests also run against the production database engine
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: rover
          POSTGRES_PASSWORD: rover
          POSTGRES_DB: rover_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rover" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Activity registry is fully wired (plugins, config, DVC stages, Grafana rows)
        run: python -m rover_ai.activities check
      - name: Tests (SQLite)
        run: pytest
      - name: Backend tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rover:rover@localhost:5432/rover_test
        run: pytest tests/test_backend.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose --profile streaming --profile monitoring --profile mlops config --quiet
      - name: Validate Prometheus rules and Alertmanager config
        run: |
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint promtool             prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/docker/alertmanager:/etc/alertmanager:ro" --entrypoint amtool             prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
      - name: Grafana dashboards are generated from build_dashboards.py
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-yaml
          python3 docker/grafana/build_dashboards.py
          git diff --exit-code docker/grafana/dashboards
      - name: Build images
        run: docker compose --profile streaming --profile mlops build backend mlflow serving spark airflow-scheduler
      - name: Retraining DAG imports and has the intended shape (inside the Airflow image)
        run: |
          docker run --rm -v "$PWD:/opt/rover:ro" -w /tmp -e AIRFLOW__CORE__LOAD_EXAMPLES=false rover-airflow:latest             bash -c "airflow db migrate > /dev/null && python -m pytest /opt/rover/tests/test_dag.py -q -p no:cacheprovider"

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (deploy, container init)
        run: shellcheck -S warning deploy/*.sh docker/*/*.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform (EC2 target) is formatted and valid
        working-directory: deploy/aws
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
