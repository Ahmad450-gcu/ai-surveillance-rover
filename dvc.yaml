# Reproducible training pipeline. Run everything (only stages whose inputs changed re-run):
#     dvc repro            then   dvc push      (store the data/model versions in the lake, bucket "dvc")
# Stage order follows the data lake zones: datasets -> raw -> validated -> (processed) -> model
stages:
  ingest:                    # public dataset -> lake (bucket "datasets"), SHA-256 verified
    cmd: python training/ingest.py --keep
    deps:
      - training/ingest.py
      - mlops/lake.py
    params:
      - dataset
    outs:
      - data/manifests/rwf2000.json:
          cache: false       # small, kept in git: which exact dataset version was used

  extract_pose:              # videos -> tracked skeletons (raw zone), same YOLO11n-pose + ByteTrack as live
    cmd: python training/extract_pose.py --workers 3 --upload --cleanup
    deps:
      - data/manifests/rwf2000.json
      - training/extract_pose.py
      - models/yolo11n-pose.pt
    outs:
      - data/raw/pose/rwf2000

  validate:                  # quality gate: raw -> validated / rejected zones, report, drift reference profile
    cmd: python training/validate_data.py --upload
    deps:
      - data/raw/pose/rwf2000
      - training/validate_data.py
      - mlops/validation.py
    params:
      - data_validation
    outs:
      - data/validated/pose/rwf2000
      - reports/data_validation_clips.jsonl
      - reports/data_profile.json:
          cache: false
    metrics:
      - reports/data_validation.json:
          cache: false

  feedback:                  # labelled stream alerts (manifest exported from the backend) -> labelled pose clips
    cmd: python -m training.feedback build
    deps:
      - data/manifests/feedback_labels.json
      - training/feedback.py
    outs:
      - data/validated/pose/rover

  features:                  # validated clips -> model-ready windows, computed once for every experiment
    cmd: python training/features.py --upload
    deps:
      - data/validated/pose/rwf2000
      - data/validated/pose/rover
      - training/features.py
      - rover_ai/learned.py
    params:
      - features
    outs:
      - data/processed/fight/rwf2000

  train_fight:               # CV + final fit + test, logged to MLflow, registered as "challenger"
    cmd: python training/train_fight.py
    deps:
      - data/processed/fight/rwf2000
      - training/train_fight.py
      - training/fightlib.py
      - rover_ai/nets.py
    params:
      - fight_model
      - registry.model_name
    outs:
      - models/candidate
    metrics:
      - reports/fight_metrics.json:
          cache: false
    plots:                   # kept in git (used by the docs)
      - reports/fight_training.png:
          cache: false
      - reports/fight_roc.png:
          cache: false
      - reports/fight_confusion.png:
          cache: false

  drift_reference:           # what the training data looks like, for data-drift monitoring (monitoring/)
    cmd: python -m monitoring.reference --upload
    deps:
      - data/validated/pose/rwf2000
      - data/validated/pose/rover
      - monitoring/drift.py
      - monitoring/reference.py
    params:
      - monitoring
      - features.data
      - features.extra_data
    outs:
      - reports/drift_reference.json:
          cache: false       # small, kept in git; the monitor reads the lake copy
