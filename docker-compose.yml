# AI Surveillance Rover – service stack.
#
#   cp .env.example .env            # then fill in the passwords
#   docker compose up -d            # core: PostgreSQL, MinIO (data lake), MLflow, backend, model serving
#   docker compose ps               # all services should become "healthy"
#
# Later phases add services behind profiles so a small machine runs only what it needs:
#   --profile streaming   Kafka, Spark, alert bridge
#   --profile monitoring  Prometheus, Alertmanager, Grafana, Kafka exporter, drift monitor
#   --profile mlops       Airflow (retraining pipeline; UI on port 8081)
#
# Every setting comes from .env, so the same file runs on a laptop or a cloud VM (e.g. AWS EC2).
name: rover

x-restart: &restart
  restart: unless-stopped

# shared by the Airflow services (mlops profile)
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/rover/airflow/dags
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__PARALLELISM: "2"               # one training at a time on a small machine
  AIRFLOW__WEBSERVER__WORKERS: "1"
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
  # what the DAG's steps need (same services as everything else, by their Docker names)
  PROJECT_DIR: /opt/rover
  ROVER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rover}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  LAKE_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  SERVING_URL: http://serving:8000/v1/models/fight
  RETRAIN_MIN_NEW_LABELS: ${RETRAIN_MIN_NEW_LABELS:-}       # empty = activities.yaml retraining.min_new_labels
  RETRAIN_MAX_AGE_DAYS: ${RETRAIN_MAX_AGE_DAYS:-}           # empty = activities.yaml retraining.max_age_days

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ${IMAGE_PREFIX:-rover}-airflow:${IMAGE_TAG:-latest}
  profiles: ["mlops"]
  user: "${AIRFLOW_UID:-50000}:0"           # Linux server: the uid owning the project folder (deploy/aws: 1000)
  environment: *airflow-env
  volumes:
    - .:/opt/rover                            # the project: DAGs, code, params, DVC data (cloud VM: the clone)
    - airflowlogs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------- operational database (alerts, telemetry, users) + MLflow/Airflow metadata ----------------
  postgres:
    image: postgres:16.4-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rover}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # ---------------- data lake (S3-compatible object storage) ----------------
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # community build of MinIO (upstream stopped publishing images)
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API (DVC, Spark, MLflow, backend)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # one-shot job: creates the lake zones and buckets, versioning and retention rules
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ---------------- experiment tracking + model registry ----------------
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: ${IMAGE_PREFIX:-rover}-mlflow:${IMAGE_TAG:-latest}
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 2
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m

  # ---------------- application backend (alerts, rover commands, dashboard) ----------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: ${IMAGE_PREFIX:-rover}-backend:${IMAGE_TAG:-latest}
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rover}
      ROVER__BACKEND__DEVICE_TOKEN: ${ROVER__BACKEND__DEVICE_TOKEN:?set ROVER__BACKEND__DEVICE_TOKEN in .env}
      ROVER__BACKEND__JWT_SECRET: ${ROVER__BACKEND__JWT_SECRET:?set ROVER__BACKEND__JWT_SECRET in .env}
    volumes:
      - ./alerts:/app/alerts                  # snapshots and clips: written by the detector on this computer,
                                              # or uploaded by one elsewhere (backend.upload_media)
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    mem_limit: 256m

  # ---------------- model serving: the registry's @champion of every activity model, hot-reloaded ----------------
  serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    image: ${IMAGE_PREFIX:-rover}-serving:${IMAGE_TAG:-latest}
    <<: *restart
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVING_MODELS: ${SERVING_MODELS:-}     # empty = every model activity of activities.yaml
      MODEL_SOURCE: ${MODEL_SOURCE:-registry}                     # registry | local (./models mounted below)
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      SHADOW_ALIAS: ${SHADOW_ALIAS-challenger}                    # scored next to the champion, never returned ("" = off)
      MODEL_DIR: /models
      RELOAD_SECONDS: ${RELOAD_SECONDS:-60}                       # promotion / rollback reaches serving within this
      SERVING_ADMIN_TOKEN: ${SERVING_ADMIN_TOKEN:-}
      ORT_THREADS: ${ORT_THREADS:-2}
    volumes:
      - servingcache:/cache                   # downloaded model versions (a restart doesn't download again)
      - ./models:/models:ro                   # only used with MODEL_SOURCE=local
    ports:
      - "${SERVING_PORT:-8000}:8000"
    mem_limit: 384m

  # ================= streaming profile:  docker compose --profile streaming up -d =================
  # ---------------- Kafka (KRaft, single broker): the frame / alert event log ----------------
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["streaming"]
    <<: *restart
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk   # KRaft cluster id (base64 UUID), fixed so the data volume stays valid
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # containers use kafka:9092; the detector on the host (or the rover) uses EXTERNAL
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 640m

  # one-shot job: creates the topics (partitions, retention)
  kafka-init:
    image: apache/kafka:3.9.1
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

  # ---------------- Spark Structured Streaming: validation, dead-letter, lake, fight scoring ----------------
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: ${IMAGE_PREFIX:-rover}-spark:${IMAGE_TAG:-latest}
    profiles: ["streaming"]
    <<: *restart
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      serving:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SERVING_URL: http://serving:8000/v1/models/fight
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rover}
      LAKE_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MAX_LAG_SECONDS: ${STREAM_MAX_LAG_SECONDS:-300}
      ALERT_TIMEZONE: ${ALERT_TIMEZONE:-Asia/Karachi}   # stream alert times in local time, like the edge's alerts
      METRICS_PORT: 9101
    volumes:
      - sparkcheckpoints:/checkpoints          # Kafka offsets + scoring state: a restart continues where it stopped
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"         # Spark UI: Structured Streaming tab (input rate, batch duration)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4040/api/v1/applications')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1536m

  # ---------------- alert bridge: topic rover.alerts -> backend ----------------
  alert-bridge:
    image: ${IMAGE_PREFIX:-rover}-spark:${IMAGE_TAG:-latest}
    profiles: ["streaming"]
    <<: *restart
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    command: ["python3", "-m", "streaming.bridge"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      BACKEND_URL: http://backend:8080
      DEVICE_TOKEN: ${ROVER__BACKEND__DEVICE_TOKEN}
    mem_limit: 128m

  # ================= monitoring profile:  docker compose --profile streaming --profile monitoring up -d =================
  # ---------------- Prometheus: metrics of every service + alert rules ----------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    <<: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle                  # POST /-/reload after editing the rules
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # ---------------- Alertmanager: routes alerts (to the drift monitor's webhook) ----------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    <<: *restart
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./docker/alertmanager:/etc/alertmanager:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 64m

  # ---------------- Grafana: dashboards as code (docker/grafana) ----------------
  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    <<: *restart
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rover-model.json
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rover}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # ---------------- Kafka metrics (topic offsets, consumer lag) for Prometheus ----------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: ["monitoring"]
    <<: *restart
    command: ["--kafka.server=kafka:9092"]
    mem_limit: 64m

  # ---------------- drift monitor: data / prediction / concept drift + Alertmanager webhook ----------------
  drift-monitor:
    image: ${IMAGE_PREFIX:-rover}-spark:${IMAGE_TAG:-latest}
    profiles: ["monitoring"]
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["python3", "-m", "monitoring.monitor"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rover}
      LAKE_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DRIFT_EVERY_SECONDS: ${DRIFT_EVERY_SECONDS:-120}
      DRIFT_WINDOW_MINUTES: ${DRIFT_WINDOW_MINUTES:-30}
      DRIFT_MIN_SAMPLES: ${DRIFT_MIN_SAMPLES:-200}
      DRIFT_MIN_FRAMES: ${DRIFT_MIN_FRAMES:-1000}
      AIRFLOW_URL: http://airflow-webserver:8080          # drift alert -> start the retraining DAG
      AIRFLOW_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    ports:
      - "${DRIFT_MONITOR_PORT:-9200}:9200"     # /report, /metrics
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  # ================= mlops profile:  docker compose --profile mlops up -d =================
  # ---------------- Airflow: the retraining pipelines (airflow/dags/retraining.py, one DAG per model activity) ----------------
  airflow-init:                               # one-shot: database migration + admin user
    <<: *airflow
    command: ["bash", "/opt/rover/docker/airflow/init.sh"]
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    restart: "no"

  airflow-scheduler:                          # also runs the tasks (LocalExecutor): training happens here
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    mem_limit: 2560m

  airflow-webserver:
    <<: *airflow
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"           # 8080 on the host is the backend
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 768m

volumes:
  pgdata:
  miniodata:
  servingcache:
  kafkadata:
  sparkcheckpoints:
  prometheusdata:
  grafanadata:
  airflowlogs:
