[project]
name = "ai-surveillance-rover"
version = "0.1.0"
description = "AI surveillance rover with an end-to-end MLOps pipeline for real-time suspicious activity detection"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "data", "outputs", "alerts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E702", "E741", "B905"]   # E501: formatter; B008: FastAPI Depends(); rest: existing compact numeric code
