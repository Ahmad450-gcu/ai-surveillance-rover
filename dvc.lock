      hash: md5
      md5: 2163b8afd51c666523a805e664598f85
      size: 2669
    - path: reports/fight_roc.png
      hash: md5
      md5: 2195d7de5617238008bce541b8451fe9
      size: 53124
    - path: reports/fight_training.png
