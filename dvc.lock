      isexec: true
    - path: monitoring/reference.py
      hash: md5
      md5: 735b8a33c75e158bd7a39b94eb2324ec
      size: 3699
      isexec: true
    params:
      params.yaml:
        features.data: data/validated/pose/rwf2000
        features.extra_data:
        - data/validated/pose/rover
        monitoring:
          max_clips: 800
          bins: 10
    outs:
    - path: reports/drift_reference.json
      hash: md5
      md5: 18d5c6d4e8e125e9cef1d842760ff28b
      size: 1937
