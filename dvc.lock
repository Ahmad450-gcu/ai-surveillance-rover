schema: '2.0'
stages:
  ingest:
    cmd: python training/ingest.py --keep
    deps:
    - path: mlops/lake.py
      hash: md5
      md5: 016ae4f3ec772ded133c35eab376e230
      size: 4411
    - path: training/ingest.py
      hash: md5
      md5: 3ea3ea38eb8c788dbb1f7b07acd06459
      size: 4819
    params:
      params.yaml:
        dataset:
          name: rwf2000
