      size: 68491
      nfiles: 3
    - path: data/validated/pose/rwf2000
      hash: md5
      md5: 43a7a47950f2bdbb2428044048a7a779.dir
      size: 30195766
      nfiles: 2000
    - path: rover_ai/learned.py
      hash: md5
      md5: 8005c71c9898c42e648c442e187eaa4d
      size: 16446
      isexec: true
    - path: training/features.py
      hash: md5
      md5: 25f7f616d89e1dc14bf4268631031f36
      size: 10672
      isexec: true
    params:
      params.yaml:
        features:
          data: data/validated/pose/rwf2000
          extra_data:
          - data/validated/pose/rover
          output: data/processed/fight/rwf2000
          window: 20
          stride: 2
          proximity: 5.0
          min_cover: 0.3
    outs:
    - path: data/processed/fight/rwf2000
      hash: md5
      md5: 19b663ac2c6d287b40b7ab403cdb807e.dir
      size: 947212420
      nfiles: 8
  train_fight:
    cmd: python training/train_fight.py
    deps:
    - path: data/processed/fight/rwf2000
      hash: md5
      md5: 19b663ac2c6d287b40b7ab403cdb807e.dir
      size: 947212420
      nfiles: 8
    - path: rover_ai/nets.py
      hash: md5
      md5: 60d21f1eccd50d9ca3883327c86d2ccc
      size: 7561
      isexec: true
    - path: training/fightlib.py
      hash: md5
      md5: b6b164b4c42a30e2679dbd8a2220bc07
      size: 8963
      isexec: true
    - path: training/train_fight.py
      hash: md5
      md5: 80c083e0739081840c479b369fdedad1
      size: 18610
      isexec: true
    params:
      params.yaml:
        fight_model:
          arch: tcn
          gru:
            hidden: 64
            layers: 2
            dropout: 0.3
          tcn:
            channels: 32
            levels: 2
            kernel: 3
            dropout: 0.195
          stgcn:
            channels: 32
            blocks: 3
            kernel: 5
            dropout: 0.2
          lr: 0.00063
          weight_decay: 1.2e-05
          batch: 256
          epochs: 40
          patience: 8
          augment:
            noise: 0.115
            joint_dropout: 0.185
            time_stretch: 0.25
          consecutive_choices:
          - 2
          - 3
          - 4
          - 5
          folds: 5
          seed: 0
        registry.model_name: fight-detector
    outs:
    - path: models/candidate
      hash: md5
      md5: a96793cb83af5e91ea53eaeb2c152349.dir
      size: 179648
      nfiles: 3
    - path: reports/fight_confusion.png
      hash: md5
      md5: 5a2d69295b20fdb261ab81c9d437abe9
      size: 65950
    - path: reports/fight_metrics.json
      hash: md5
      md5: 8ef0c995a8e6d57c78423e603956592b
      size: 2468
    - path: reports/fight_roc.png
      hash: md5
      md5: 82f730d3bc2fe585cae3618d15964dde
      size: 59603
    - path: reports/fight_training.png
      hash: md5
      md5: 41096880727a75f4f0f013c4964701f7
      size: 76295
