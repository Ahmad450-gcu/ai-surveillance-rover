schema: '2.0'
stages:
  ingest:
    cmd: python training/ingest.py --keep
    deps:
    - path: mlops/lake.py
      hash: md5
      md5: f799feb84f6d597094f2971d3b4379c5
      size: 5177
    - path: training/ingest.py
      hash: md5
      md5: 3ea3ea38eb8c788dbb1f7b07acd06459
      size: 4819
    params:
      params.yaml:
        dataset:
          name: rwf2000
          url: 
            https://huggingface.co/datasets/DanJoshua/RWF-2000/resolve/d8bcb9661fa6130b7295fc20712abd9e1b358036/RWF-2000.tar.gz
          sha256: 
            227c01e017ee3df8753388f81bf0ab65705f5009f3f0e29f7db18bacd81a2d50
          size: 12315601005
          bucket: datasets
          key: rwf2000/RWF-2000.tar.gz
          license: research use only (Cheng, Cai & Li, ICPR 2020)
    outs:
    - path: data/manifests/rwf2000.json
      hash: md5
      md5: ed58083d6910b9819c62cfa5b2b9b533
      size: 385
  extract_pose:
    cmd: python training/extract_pose.py --workers 3 --upload --cleanup
    deps:
    - path: data/manifests/rwf2000.json
      hash: md5
      md5: ed58083d6910b9819c62cfa5b2b9b533
      size: 385
    - path: models/yolo11n-pose.pt
      hash: md5
      md5: 475cd7f66ff9f02e47cf6546bcab42a7
      size: 6255593
    - path: training/extract_pose.py
      hash: md5
      md5: 6e2432f1c1461dd0b478d33ae02c924e
      size: 9232
    outs:
    - path: data/raw/pose/rwf2000
      hash: md5
      md5: 43a7a47950f2bdbb2428044048a7a779.dir
      size: 30195766
      nfiles: 2000
  validate:
    cmd: python training/validate_data.py --upload
    deps:
    - path: data/raw/pose/rwf2000
      hash: md5
      md5: 43a7a47950f2bdbb2428044048a7a779.dir
      size: 30195766
      nfiles: 2000
    - path: mlops/validation.py
      hash: md5
      md5: 9efdcba173aca0281c3a262c9e552d37
      size: 8333
    - path: training/validate_data.py
      hash: md5
      md5: 7a596a5413d4a0e796d3edaada02f6b6
      size: 5386
    params:
      params.yaml:
        data_validation:
          input: data/raw/pose/rwf2000
          output: data/validated/pose/rwf2000
          min_frames: 20
          box_tolerance: 0.05
          low_keypoint_conf: 0.3
          max_reject_rate: 0.05
          min_clips_per_class: 50
          class_balance:
          - 0.3
          - 0.7
    outs:
    - path: data/validated/pose/rwf2000
      hash: md5
      md5: 43a7a47950f2bdbb2428044048a7a779.dir
      size: 30195766
      nfiles: 2000
    - path: reports/data_profile.json
      hash: md5
      md5: 353458316a8b26df9c9b319e1f26bff5
      size: 2729
    - path: reports/data_validation.json
      hash: md5
      md5: c044861ed47cb974d77d58e3a36cf603
      size: 1592
    - path: reports/data_validation_clips.jsonl
      hash: md5
      md5: f51c77fde6e771a8de8d45eab2a24da5
      size: 801793
  features:
    cmd: python training/features.py --upload
    deps:
    - path: data/validated/pose/rwf2000
      hash: md5
      md5: 43a7a47950f2bdbb2428044048a7a779.dir
      size: 30195766
      nfiles: 2000
    - path: rover_ai/learned.py
      hash: md5
      md5: 8005c71c9898c42e648c442e187eaa4d
      size: 16446
    - path: training/features.py
      hash: md5
      md5: 9c1584705d6b0946b83eaa970a05d356
      size: 9636
    params:
      params.yaml:
        features:
          data: data/validated/pose/rwf2000
          extra_data: []
          output: data/processed/fight/rwf2000
          window: 20
          stride: 2
          proximity: 5.0
          min_cover: 0.3
    outs:
    - path: data/processed/fight/rwf2000
      hash: md5
      md5: 300481f07a487de35801160aa522b016.dir
      size: 945203401
      nfiles: 3
  train_fight:
    cmd: python training/train_fight.py
    deps:
    - path: data/processed/fight/rwf2000
      hash: md5
      md5: 300481f07a487de35801160aa522b016.dir
      size: 945203401
      nfiles: 3
    - path: rover_ai/nets.py
      hash: md5
      md5: 60d21f1eccd50d9ca3883327c86d2ccc
      size: 7561
    - path: training/fightlib.py
      hash: md5
      md5: 9a2f9370d1947de877cf779b41f1eaf1
      size: 8664
    - path: training/train_fight.py
      hash: md5
      md5: 5b0be4e9ecb5342fdf2100d7a9f29cfd
      size: 16271
    params:
      params.yaml:
        fight_model:
          arch: tcn
          gru:
            hidden: 64
            layers: 2
            dropout: 0.3
          tcn:
            channels: 32
            levels: 2
            kernel: 3
            dropout: 0.195
          stgcn:
            channels: 32
            blocks: 3
            kernel: 5
            dropout: 0.2
          lr: 0.00063
          weight_decay: 1.2e-05
          batch: 256
          epochs: 40
          patience: 8
          augment:
            noise: 0.115
            joint_dropout: 0.185
            time_stretch: 0.25
          consecutive_choices:
          - 2
          - 3
          - 4
          - 5
          folds: 5
          seed: 0
        registry.model_name: fight-detector
    outs:
    - path: models/candidate
      hash: md5
      md5: 32c4704c5036be018475efae5a14f2f4.dir
      size: 179401
      nfiles: 3
    - path: reports/fight_confusion.png
      hash: md5
      md5: 4c1a0e9a1777579f6148f62b1b659498
      size: 59635
    - path: reports/fight_metrics.json
      hash: md5
      md5: c33e822a14ef51c1d2dfe92f1da7389f
      size: 5020
    - path: reports/fight_roc.png
      hash: md5
      md5: 3df7c8c8ba95cb3281410812abe4f778
      size: 52495
    - path: reports/fight_training.png
      hash: md5
      md5: 1cc670b6c0c1ef9dd9e31bbfb7ffcdb2
      size: 72008
  drift_reference:
    cmd: python -m monitoring.reference --upload
    deps:
    - path: data/validated/pose/rwf2000
      hash: md5
      md5: 43a7a47950f2bdbb2428044048a7a779.dir
      size: 30195766
      nfiles: 2000
    - path: monitoring/drift.py
      hash: md5
      md5: 33e7bd57253f5020c7fed6e7f96fb038
      size: 4279
    - path: monitoring/reference.py
      hash: md5
      md5: fed0898591cb4e1aa6eb0adb686ca4e8
      size: 3168
    params:
      params.yaml:
        monitoring:
          data: data/validated/pose/rwf2000
          max_clips: 800
          bins: 10
    outs:
    - path: reports/drift_reference.json
      hash: md5
      md5: 048c9f2f2a0009dab5b98568df7c6c64
      size: 2033
